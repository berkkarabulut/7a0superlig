:root{--bg:#14061f;--card:#1f0a33;--card2:#2a0f45;--line:#3e1a5c;--txt:#ffffff;--mut:#c9a3e0;--acc:#e30a17;--acc2:#ff5a36;--gold:#ffb703;--teal:#00c2a8;--blue:#3d8bff;--grass:#1c6b3d;--grass2:#18603a;--win:#00d9b8;--loss:#ff4d6d;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.logo{font-weight:900;font-size:22px}.logo b{color:var(--acc)}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;padding:6px 10px}
nav button.on{color:var(--txt)}
main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:32px;margin:8px 0 6px}h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.gold{background:var(--gold);color:#222}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.mode{cursor:pointer;text-align:left;color:var(--txt);font:inherit}
.mode.on{border-color:var(--gold)}
.mode b{display:block;font-size:17px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 420px;gap:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}
  .grid.draft{grid-template-columns:minmax(0,1fr) minmax(0,42%);gap:12px;align-items:start}
  .grid.draft>.side{position:sticky;top:8px}}
.pitch{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--grass) 0 10%,var(--grass2) 10% 20%);border:2px solid #2f8a50}
.pitch:before{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid #ffffff40}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid #ffffff40;border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);width:88px;text-align:center;z-index:2}
.dot{width:40px;height:40px;margin:0 auto 3px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#0008;border:2px dashed #fff8;color:#fff;position:relative}
.slot.full .dot{background:var(--acc);border:2px solid #fff}
.slot.full .dot.t-r90{background:#9b5de5;color:#fff}.slot.full .dot.t-r87{background:#f2c14e;color:#222}.slot.full .dot.t-r84{background:#3fb96b;color:#fff}
.slot.full .dot.t-r80{background:#3b8fd9;color:#fff}.slot.full .dot.t-r70{background:#7d8a83;color:#fff}.slot.full .dot.t-rq{background:#444;color:#fff}
.rv{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:6px;font-weight:800}
.rv.r90{background:#9b5de530;color:#c9a2ff}.rv.r87{background:#f2c14e2a;color:#f2c14e}.rv.r84{background:#3fb96b2a;color:#7ee08f}
.rv.r80{background:#3b8fd92a;color:#8cc4ff}.rv.r70{background:#ffffff12;color:#a9b4ad}.rv.rq{background:#ffffff12;color:#a9b4ad}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.drawbtns{gap:8px;flex-wrap:nowrap}.btn.restart{padding:12px 14px;color:var(--mut)}
@media(max-width:700px){.drawbtns{width:100%;flex-wrap:wrap}.drawbtns .btn{flex:1 1 100%}}
.leader{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#f2c14e18;border:1px solid #f2c14e55;color:var(--txt);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle}
.repbtn{background:none;border:0;cursor:pointer;opacity:.45;font-size:13px;padding:2px}.repbtn:hover{opacity:1}
.inp{width:100%;background:#0f1813;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;margin-top:8px}
.col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
@media(max-width:700px){.leader{display:block;margin:6px 0 0}.leader.hidden{display:none}}
.namebox{display:flex;gap:8px;margin:16px 0 8px}
.namebox input,.namebox select{background:#0f1813;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:13px 12px;font:inherit;font-size:17px;font-weight:700}
.namebox input{flex:1;min-width:0;text-transform:none}.namebox select{max-width:46%}
.namebox input:focus,.namebox select:focus{outline:2px solid var(--gold);border-color:transparent}
.preview{font-size:30px;font-weight:900;color:var(--gold);min-height:40px;margin-top:6px;word-break:break-word}

.online{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--txt);background:#ffffff10;border:1px solid var(--line);padding:4px 10px;border-radius:999px;vertical-align:middle;margin-left:10px}
.online i{width:8px;height:8px;border-radius:50%;background:#3fdc72;box-shadow:0 0 0 0 #3fdc7288;animation:livepulse 2s infinite}
@keyframes livepulse{70%{box-shadow:0 0 0 7px #3fdc7200}100%{box-shadow:0 0 0 0 #3fdc7200}}
.chemlist{font-size:12px;margin-top:8px;color:#b9e6c5;line-height:1.5}
.events li.ev-save span:last-child,.events li.ev-post span:last-child,.events li.ev-wide span:last-child{color:var(--mut)}
.events li.ev-goal{font-weight:700}.events li.ev-red{color:#ff8a8a}
.events li.penh{justify-content:center;font-weight:800;color:var(--gold);background:#f2c14e10}
.events li.pm span:last-child{opacity:.75}
.pensc{font-size:16px;color:var(--gold);letter-spacing:0;margin-top:-4px}
.rec{font-size:96px;font-weight:900;line-height:1;letter-spacing:2px}.rec.gold{color:var(--gold)}
@media(max-width:700px){.rec{font-size:72px}}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:480px;width:100%}
.bracket{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:stretch}
.bcol{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1 0 150px}
.bbody{display:flex;flex-direction:column;justify-content:space-around;gap:8px;flex:1}
.bh{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;text-align:center}
.bm{border:1px solid var(--line);border-radius:8px;background:#0f1813;overflow:hidden;font-size:12px}
.bm.empty{text-align:center;color:var(--mut);padding:8px}
.bm.champ{padding:10px;text-align:center;font-weight:800;border-color:var(--gold);color:var(--gold)}
.bt{display:flex;justify-content:space-between;gap:6px;padding:5px 7px}
.bt+.bt{border-top:1px solid var(--line)}
.bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt.w{font-weight:800}.bt.l{opacity:.55}
.bt.me{background:#f2c14e18;color:var(--gold)}
.bt small{font-weight:400;color:var(--mut)}
.bt b{white-space:nowrap;flex:0 0 auto}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.scrollx{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;scrollbar-width:thin}
.scrollx>*{flex:0 0 auto}
@media(max-width:700px){
  header{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  .logo{font-size:19px}
  nav{display:flex;overflow-x:auto;width:100%;gap:2px}
  nav button{padding:6px 8px;font-size:14px;white-space:nowrap}
  main{padding:12px}
  h1{font-size:24px}h2{font-size:18px}
  .card{padding:12px;border-radius:12px}
  .grid{display:flex;flex-direction:column;gap:12px}
  .grid.draft{display:grid;grid-template-columns:minmax(0,1fr) 44%;gap:8px;align-items:start}
  .grid.draft>.side{position:sticky;top:8px}
  .grid.draft .pitch{aspect-ratio:3/4.6}
  .grid.draft .slot{width:52px}.grid.draft .dot{width:26px;height:26px;font-size:10px;border-width:1.5px}
  .grid.draft .slot .nm{font-size:8.5px;line-height:1.05}.slot .tm{display:none}
  .grid.draft .stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding:8px;margin-top:6px}
  .grid.draft .stat b{font-size:14px}.grid.draft .stat span{font-size:10px}
  .grid.draft .pl{gap:6px;padding:7px 7px;min-height:44px;font-size:13px}
  .grid.draft .pl .pos{min-width:30px;font-size:9.5px;padding:2px 3px}
  .grid.draft .tag{margin-right:3px;padding:1px 4px;font-size:10px}
  .grid.draft .rv{min-width:24px;padding:1px 4px;font-size:12px}
  .grid.draft .draw h2{font-size:15px}
  .grid.draft .card{padding:10px}
  .grid.draft .chip{padding:7px 10px;font-size:13px}
  .grid.draft .legend{font-size:10px;gap:4px}
  .grid.draft .plist{grid-template-columns:minmax(0,1fr)}
  .grid.draft .pl{min-width:0;width:100%}
  .grid.draft .pl>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grid.draft .slot .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px;margin:0 auto}
  .grid.draft .stats .stat:nth-child(n+4){display:none}
  .grid.draft .stats{grid-template-columns:1fr 1fr 1fr}
  .grid.draft #selcard b{font-size:14px}
  .stats{gap:10px;margin-top:8px}.stat b{font-size:17px}
  .plist{grid-template-columns:1fr}
  .pl{min-height:46px;padding:9px 10px}
  .draw .btn{width:100%}
  .btn{padding:13px 16px;width:100%}
  .row .btn{flex:1 1 auto}
  .chip{padding:9px 13px}
  .score{gap:8px;padding:12px 4px}.score .big{font-size:36px}.score .tn{font-size:14px}
  .events{max-height:none}
  .result .big{font-size:38px}
  table{font-size:13px}td,th{padding:5px 3px}
  .path{flex-wrap:nowrap;overflow-x:auto}.path span{flex:0 0 auto}
  .modes{grid-template-columns:1fr}
  .mode-desc{display:none}
}
.slot.leg .dot{box-shadow:0 0 0 3px var(--gold)}
.slot.ok{cursor:pointer}.slot.ok .dot{background:var(--gold);color:#222;border:2px solid #fff;animation:pulse 1s infinite}
.slot.no{opacity:.35}
.slot.ok.near .dot{background:#f08a24;color:#fff}
.slot.offp .dot:after{content:"!";position:absolute;top:-6px;right:-6px;background:#f08a24;color:#fff;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:16px}
.chip.nearc{border-color:#f08a24;color:#f0a050}
.pl.nat{border-color:#2f8a50}
.tag{font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px;margin-right:6px}
.tag.ok{background:#7ee08f25;color:var(--win)}.tag.in{background:#ffffff18;color:var(--txt)}.tag.nr{background:#f08a2430;color:#f0a050}
.hint{border-color:#f08a24;background:#2a1d10;color:#f3d2ae;font-size:14px;margin-bottom:10px}
.btn.blink{background:var(--acc);color:#fff;border:0;animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px #e30a1740;filter:brightness(1.25)}}
@keyframes pulse{50%{transform:scale(1.12)}}
.pl.sel{border-color:var(--gold);background:#2a2410}
.slot .nm{font-size:11px;font-weight:700;line-height:1.15;text-shadow:0 1px 2px #000}
.slot .tm{font-size:9.5px;color:#ffffffc0;text-shadow:0 1px 2px #000}
.draw{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#ffffff14;color:var(--mut)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f1813;cursor:pointer;text-align:left;color:var(--txt);font:inherit}
.pl:hover:not(:disabled){border-color:var(--gold)}
.pl:disabled{opacity:.35;cursor:default}
.pos{font-size:11px;font-weight:800;min-width:38px;text-align:center;padding:3px 4px;border-radius:5px;background:#ffffff14}
.pos.GK{color:#7fb0ff}.pos.DF{color:#6fc3ff}.pos.MF{color:#7ee08f}.pos.FW{color:#ff7a7a}
.rt{margin-left:auto;font-weight:800;white-space:nowrap}
.seal{color:var(--gold);font-size:13px;margin-left:4px}
.price{font-size:12px;color:var(--mut);margin-left:6px}
.stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;text-align:center;padding:18px 10px}
.score .tn{font-weight:800;font-size:17px}
.score .big{font-size:48px;font-weight:900;letter-spacing:2px}
.clock{font-weight:800;color:var(--gold);font-size:15px}
.bar{height:6px;background:#ffffff14;border-radius:3px;overflow:hidden;margin:6px 0 0}
.bar i{display:block;height:100%;background:var(--gold);width:0}
.events{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}

.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}

body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg)}

.pos{border-radius:2px;background:#3a1257;font-family:var(--cond);font-size:12px;letter-spacing:.4px}

.badge{border-radius:2px;background:var(--acc);color:#fff;font-size:12px}

function startDraft(){
  if (S.mode==="daily"){ const k=todayKey(); RNG = seeded([...k].reduce((a,c)=>a*31+c.charCodeAt(0),7)); S.deck = shuffle(POOL).slice(0,40); S.deckI = 0; }
  else { if (S.challenge){ S.form = S.challenge.form; S.seed = S.challenge.seed; } else S.seed = Math.floor(Math.random()*2e9);
    RNG = seeded(S.seed); S.deck = shuffle(POOL); S.deckI = 0; }
  bump("g");
  S.slots = FORMATIONS[S.form].map(([pos,x,y])=>({pos,x,y,p:null}));
  S.phase = "xi"; S.bench = [];
  S.rolls = 0; S.rerolls = REROLLS; S.used = new Set(); S.drawn = new Set(); S.spent = 0; S.counted = S.mode==="daily" && !store.get("daily:"+todayKey(), null);
  roll();
}
function askRestart(){
  const n = S.slots.filter(s=>s.p).length;
  if (!n) { renderStart(); return; }
  $("restartbox").innerHTML = `<div class="card hint" style="border-color:#e30a17;background:#2a1012">
    <b>Baştan başlamak istiyor musun?</b> Kadrona aldığın ${n} oyuncu silinecek, diziliş ve tarz seçimine döneceksin.${S.mode==="daily"?" Günün meydan okumasında yine aynı takım sırası gelir.":""}
    <div class="row" style="margin-top:10px"><button class="btn" onclick="renderStart()">Evet, baştan başla</button><button class="btn ghost" onclick="$('restartbox').innerHTML=''">Vazgeç</button></div></div>`;
  try { $("restartbox").scrollIntoView({block:"center",behavior:"smooth"}); } catch(e){}
}
function reroll(){
  if (S.rerolls<=0) return;
  S.rerolls--; roll();
}
function updateForced(){ S.forced=false; if (S.rerolls<=0 && !S.cur.players.some(canPick)) S.forced=true; }
function roll(){
  let t;
  if (S.deck){ let k=0; do { t = S.deck[S.deckI % S.deck.length]; S.deckI++; k++; } while (k<S.deck.length && !t.players.some(p=>!inSquad(p.n) && openSlots().some(s=>natural(p,s.pos)))); }
  else {
    const useful = x => x.players.some(p => !inSquad(p.n) && openSlots().some(s=>natural(p,s.pos)));
    let c = POOL.filter(x=>!S.drawn.has(x.id) && useful(x));
    if(!c.length){ S.drawn.clear(); c = POOL.filter(useful); }
    if(!c.length) c = POOL;
    t = rnd(c);
  }
  S.drawn.add(t.id); S.cur = t; S.rolls++; S.sel = null;
  updateForced();
  renderDraft();
  try { if (window.innerWidth<=700) window.scrollTo({top:0,behavior:"smooth"}); } catch(e){}
}
const curSlots = () => S.phase==="bench" ? S.bench : S.slots;
const openSlots = () => curSlots().filter(s=>!s.p);
const openPos = () => new Set(openSlots().map(s=>NAME[s.pos]));
const keyOf = p => S.cur.id+"|"+p.n;
const inSquad = n => S.slots.some(s=>s.p && s.p.n===n) || (S.bench||[]).some(s=>s.p && s.p.n===n);
function canPick(p){
  if (S.used.has(keyOf(p)) || inSquad(p.n)) return false;
  if (!openSlots().some(s=>fits(p,s.pos))) return false;
  if (S.mode==="daily" && S.phase!=="bench" && S.spent + price(p.r) > DAILY_BUDGET - minRest(1)) return false;
  return true;
}
function minRest(extra){ return Math.max(0, S.slots.filter(s=>!s.p).length - extra); } // her boş yer için en az 1 M kalsın
function pick(i){
  const p = S.cur.players[i]; if(!canPick(p)) return;
  if (S.phase==="bench"){ let si = S.bench.findIndex(s=>!s.p && natural(p,s.pos)); if (si<0) si = S.bench.findIndex(s=>!s.p && fits(p,s.pos)); if (si<0) return;
    S.sel = i; S.lastBench = p.n; return place(si); }
  S.sel = (S.sel===i) ? null : i; renderDraft();
}
function place(si){
  if (S.sel==null) return;
  const arr = curSlots(), p = S.cur.players[S.sel], slot = arr[si];
  if (!slot || slot.p || !fits(p, slot.pos)) return;
  S.sel = null;
  const pen = penaltyFor(p, slot.pos), off = pen>0;
  S.forced = false;
  const meta = {team:S.cur.team, season:S.cur.season, key:S.cur.id};
  if (S.phase==="bench") slot.p = {...p, base:p.r, ...meta};
  else slot.p = {...p, r: p.r-pen, base:p.r, off, forced: pen===FORCED, ...meta};
  S.used.add(keyOf(p)); if (S.phase!=="bench") S.spent += S.mode==="daily" ? price(p.r) : 0;
  if (S.phase!=="bench" && S.slots.every(s=>s.p)) return startBench();
  if (S.phase==="bench" && S.bench.every(s=>s.p)) return renderReady();
  roll();
}

function chemistry(players){
  const parts=[]; let total=0;
  const ks={}; players.forEach(p=>ks[p.key]=(ks[p.key]||0)+1);
  for (const [k,n] of Object.entries(ks)) if(n>1){ const v=(n-1)*0.5; total+=v; parts.push(`${k.replace("|"," ")} (${n} oyuncu) +${v}`); }
  const cl={}; players.forEach(p=>cl[p.team]=(cl[p.team]||0)+1);
  for (const [c,n] of Object.entries(cl)) if(n>=3){ const v=n>=5?2:n===4?1.5:1; total+=v; parts.push(`${c} kulüp bağı (${n}) +${v}`); }
  const names=new Set(players.map(p=>p.n));
  for (const [a,b] of DUOS) if(names.has(a)&&names.has(b)){ total+=1; parts.push(`Efsane ikili: ${short(a)} & ${short(b)} +1`); }
  return { total: Math.min(5,total), parts };
}
function teamPower(players, style){
  const allAvg = avg(players.map(p=>p.r)) - 3;
  const by = k => { const a = players.filter(p=>p.pos===k).map(p=>p.r); return a.length ? avg(a) : allAvg; };
  const gk = by("GK"), df = by("DF"), mf = by("MF"), fw = by("FW");
  let att = fw*0.5 + mf*0.35 + df*0.15;
  let def = gk*0.35 + df*0.45 + mf*0.2;
  const chem = players[0]?.key ? chemistry(players).total : 0;
  const st = styleMod(style, players);
  const off = players.filter(p=>p.off).length, pen = off*TEAM_OFF;
  return { att: att+st.att+chem-pen, def: def+st.def+chem-pen, chem, off, style: STYLES[style]?style:"Dengeli", ovr: Math.round(avg(players.map(p=>p.r))) };
}

      const target = ev => { const x=document.elementFromPoint(ev.clientX,ev.clientY); return x && x.closest ? x.closest("[data-drop]") : null; };
      const move = ev => { if (!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8){ ghost=el.cloneNode(true); ghost.classList.add("dragghost"); ghost.style.width=el.offsetWidth+"px"; document.body.appendChild(ghost); el.classList.add("dragging"); }
        if (ghost){ ev.preventDefault(); ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
          if (ev.clientY < 70) window.scrollBy(0,-14); else if (ev.clientY > window.innerHeight-70) window.scrollBy(0,14); const tg=target(ev); if (tg!==hov){ hov?.classList.remove("hov"); hov=tg; if (hov && hov!==el) hov.classList.add("hov"); } } };
      const end = ev => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", end); el.removeEventListener("pointercancel", cancel);
        hov?.classList.remove("hov"); el.classList.remove("dragging");
        if (ghost){ ghost.remove(); const tg=target(ev); if (tg && tg.dataset.drop!==src) onDrop(src, tg.dataset.drop); }
        else onTap(src); };
      const cancel = () => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", end); el.removeEventListener("pointercancel", cancel); ghost?.remove(); hov?.classList.remove("hov"); el.classList.remove("dragging"); };
      el.addEventListener("pointermove", move); el.addEventListener("pointerup", end); el.addEventListener("pointercancel", cancel);
    });
  });
}

function checkAch({champ,perfect,unbeaten,seven}){
  const got = new Set(store.get("ach", [])), before = new Set(got), me = S.T.me, pw = teamPower(me,S.style);
  got.add("ilk");
  if (champ){ got.add("sampiyon"); if(unbeaten) got.add("yenilmez"); if(seven) got.add("yedisifir"); if(perfect) got.add("kilit");
    if(S.almanac){ got.add("almanak"); if(seven) got.add("almanak70"); }
    if(S.mode==="daily"){ got.add("gunluk"); if(S.spent<50) got.add("cimri"); }
    if(me.filter(p=>!["Galatasaray","Fenerbahçe","Beşiktaş","Başakşehir"].includes(p.team)).length>=6) got.add("anadolu");
    if(me.every(p=>p.season.startsWith("198"))) got.add("seksenler");
    const c={}; me.forEach(p=>c[p.team]=(c[p.team]||0)+1); if(Math.max(...Object.values(c))>=8) got.add("tek");
    if(pw.ovr<80) got.add("zayif");
  }
  store.set("ach",[...got]);
  return ACH.filter(a=>got.has(a[0])&&!before.has(a[0])).map(a=>a[1]);
}

   <h3>Taktik</h3><p>7 oyun tarzı var: Dengeli, Topa sahip ol, Önde baskı, Kontra atak, Kanat oyunu, Uzun top ve Otobüsü çek. Bazı tarzlar birbirini yener: kontra önde basana, önde baskı topa sahip olana, uzun top önde basana, kanat oyunu ve topa sahip olmak otobüse karşı etkilidir. Tarzın gücü kadrona da bağlı: topa sahip olmak iyi orta saha, kanat oyunu iyi kanat ve bekler, kontra ve uzun top iyi forvet ister. Önde baskı 60. dakikadan sonra yorar. Rakiplerin de tarzı var, çoğu teknik direktörüne göre. Maç önünde rakibin tarzını görüp kendi tarzını seçersin. Devre arasında oyun durur: tarzı değiştirebilir, hücuma geçebilir ya da skoru korumaya çekilebilir, oyuncu değiştirebilirsin (Anında hızda devre arası atlanır).</p>

function quizBest11(t){
  const take = (line, n) => t.players.filter(p=>p.p[0]===line).sort((a,b)=>b.r-a.r).slice(0,n);
  let xi = [...take("GK",1), ...take("DF",4), ...take("MF",3), ...take("FW",3)];
  if (xi.length<11) xi = xi.concat(t.players.filter(p=>!xi.includes(p)).sort((a,b)=>b.r-a.r).slice(0,11-xi.length));
  return xi;

function startQuiz(practice){
  const day = todayKey(), seed = practice ? Math.floor(Math.random()*1e9) : [...("quiz"+day)].reduce((a,c)=>a*31+c.charCodeAt(0),11);
  const R = seeded(seed), pick = a => a[Math.floor(R()*a.length)];
  const pool = POOL.filter(t=>t.players.length>=11), qs = [], used = new Set();
  while (qs.length<QN){ const t = pick(pool); if (used.has(t.id)) continue; used.add(t.id);
    const same = pool.filter(x=>x.team===t.team && x.id!==t.id), other = pool.filter(x=>x.team!==t.team), opts=[t];
    while (opts.length<4){ const c = (opts.length<3 && same.length && R()<0.75) ? pick(same) : pick(other); if (!opts.includes(c)) opts.push(c); }
    for (let i=opts.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
    qs.push({t, opts}); }
  S.Q = {qs, i:0, ans:[], practice, day};
  if (!practice) bump("q");
  renderQuiz();
}

function ac(){ try { if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==="suspended") AC.resume(); return AC; } catch(e){ return null; } }
function noise(dur, f0, f1, vol){
  const a=ac(); if(!a) return; const n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(0.6+0.4*Math.sin(i/a.sampleRate*9));
  const src=a.createBufferSource(); src.buffer=buf; const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=0.8;
  bp.frequency.setValueAtTime(f0,a.currentTime); bp.frequency.linearRampToValueAtTime(f1,a.currentTime+dur);

  src.connect(bp).connect(g).connect(a.destination); src.start();
}
function whistle(times=1){
  const a=ac(); if(!a) return;
  for (let k=0;k<times;k++){ const t=a.currentTime+k*0.42, o=a.createOscillator(), lfo=a.createOscillator(), lg=a.createGain(), g=a.createGain();
    o.frequency.value=2900; lfo.frequency.value=32; lg.gain.value=120; lfo.connect(lg).connect(o.frequency);

  if (BASE_CSS==null) BASE_CSS = el.textContent;
  const m = THEMES[curTheme()].map;
  el.textContent = Object.keys(m).length ? BASE_CSS.replace(/#([0-9a-fA-F]{6})(?=[0-9a-fA-F]{2}\b|\b)/g, (all,h) => m[h.toLowerCase()] ? "#"+m[h.toLowerCase()] : all) : BASE_CSS;
  try { document.querySelector('meta[name="theme-color"]').setAttribute("content", THEMES[curTheme()].meta); } catch(e){}
}
function setTheme(k){ store.set("tema", k); applyTheme(); if (document.getElementById("setbox")) openSettings(); }
function themeChips(){ return Object.entries(THEMES).map(([k,v])=>`<button class="chip ${k===curTheme()?"on":""}" onclick="setTheme('${k}')">${v.ad}</button>`).join(""); }

// Maç anlatımı gibi üretilen cümleler için veri (TXT, konuşmalar) doğrudan dile göre değiştirilir.
const LANGS = { tr:"🇹🇷 Türkçe", en:"🇬🇧 English", es:"🇪🇸 Español" };
const detectLang = () => { try { const l=(navigator.language||"tr").slice(0,2).toLowerCase(); return l==="tr"?"tr":l==="es"?"es":"en"; } catch(e){ return "tr"; } };
const LANG = (() => { const s = store.get("dil", null); return LANGS[s] ? s : (typeof navigator!=="undefined" && typeof location!=="undefined" && location.protocol.startsWith("http") ? detectLang() : "tr"); })();
const LI = LANG==="en" ? 0 : 1;
function setLang(k){ store.set("dil", k); try { location.reload(); } catch(e){} }
function langChips(){ return Object.entries(LANGS).map(([k,v])=>`<button class="chip ${k===LANG?"on":""}" onclick="setLang('${k}')">${v}</button>`).join(""); }

 ["Günün Meydan Okuması:","Daily Challenge:","Reto del día:"],["Tek oyunculu:","Solo:","Individual:"],["Almanak:","Almanac:","Almanaque:"],
 ["Diziliş (9 seçenek) ve oyun tarzı seç. Her çekilişte bir sezon-takım gelir. Oyuncuya dokunursun, sahada oynayabileceği yerler yanar, hangisine koyacağını sen seçersin (sağ bek sağ beke, kanat oyuncusu kanada ya da forvete gibi). Yakın bir mevkiye de koyabilirsin ama mevki dışı oynayan oyuncu 4 reyting kaybeder ve takımın hücumu ile savunması 2.5 puan düşer, kazanmak çok zorlaşır. Kadro başına 2 yeniden çekme hakkın var. Kura sadece işine yarayacak oyuncusu olan takımları getirir. Bir oyuncuyu kadroya bir kez alabilirsin, başka sezonla tekrar gelirse seçilemez. Beğenmezsen yeniden çek. Reytingi 88 ve üstü olan oyuncular efsanedir ve altın yıldız taşır. Aynı takım-sezondan oyuncu topladıkça kimya bonusu alırsın.","Pick a formation (9 options) and a playing style. Each draw brings a team from a season. Tap a player and the spots he can play light up; you choose where he goes (a right back at right back, a winger on the wing or up front). You can use a nearby position, but an out-of-position player loses 4 rating and your attack and defence drop by 2.5, making it much harder to win. You have 2 redraws per squad. The draw only brings teams with players you can use. Each player can be picked once; if he shows up again from another season he can't be picked. Don't like the team? Redraw. Players rated 88+ are legends and carry a gold star. Collecting players from the same team-season gives you chemistry.","Elige formación (9 opciones) y estilo de juego. Cada sorteo trae un equipo de una temporada. Toca un jugador y se iluminan los puestos donde puede jugar; tú decides dónde (un lateral derecho de lateral, un extremo en banda o arriba). Puedes usar una posición cercana, pero fuera de posición pierde 4 de valoración y tu ataque y defensa bajan 2.5; ganar será mucho más difícil. Tienes 2 cambios de sorteo por plantilla. El sorteo solo trae equipos con jugadores útiles. Cada jugador se elige una vez; si vuelve con otra temporada no se puede elegir. ¿No te gusta? Vuelve a sortear. Los jugadores de 88+ son leyendas y llevan estrella dorada. Juntar jugadores del mismo equipo-temporada da química."],
 ["7 maç: 4 takımlı grupta 3 maç, ilk 2'ye girersen Son 16, çeyrek final, yarı final ve final. Maçlar dakika dakika oynanır, goller atan oyuncu ve dakikasıyla düşer. Reyting, diziliş ve tarz sonucu etkiler ama sürpriz her zaman olabilir. Maçta direkten dönen toplar, kurtarışlar, penaltılar, sarı ve kırmızı kartlar olur. Kırmızı gören takım 10 kişi kalır ve zorlanır. Eleme maçı berabere biterse 30 dakika uzatma oynanır, yine eşitlik olursa penaltılara gidilir.","7 matches: 3 in a group of 4, and if you finish top 2, the Round of 16, quarter-final, semi-final and final. Matches play out minute by minute with scorers and times. Ratings, formation and style shape the result, but surprises always happen. Expect woodwork, saves, penalties, yellow and red cards. A team with a red card plays with 10 and struggles. A drawn knockout match goes to 30 minutes of extra time, then penalties.","7 partidos: 3 en un grupo de 4 y, si quedas entre los 2 primeros, octavos, cuartos, semifinal y final. Los partidos se juegan minuto a minuto con goleadores y minutos. Valoraciones, formación y estilo influyen, pero siempre hay sorpresas. Hay palos, paradas, penaltis, amarillas y rojas. Con una roja se juega con 10 y cuesta. Un empate en eliminatoria va a 30 minutos de prórroga y luego a penaltis."],
 ["Sonucun bir skor gibi yazılır: kazandığın maç sayısı, tire, kazanamadığın maç sayısı. Penaltıyla kazanılan eleme maçları galibiyet sayılır, elenirsen kalan maçlar kayıp sayılır. 7 maçın 7'sini de kazanırsan 7-0 yaparsın. Bir de gol yemeden yaparsan \"Kalede kilit\" başarımı açılır.","Your result reads like a score: matches won, dash, matches not won. Knockout wins on penalties count as wins; if you're knocked out, the remaining matches count as losses. Win all 7 and you go 7-0. Do it without conceding and you unlock \"Clean sheet king\".","Tu resultado se lee como un marcador: partidos ganados, guion, partidos no ganados. Ganar en penaltis cuenta como victoria; si te eliminan, los partidos restantes cuentan como derrotas. Gana los 7 y haces 7-0. Hazlo sin encajar y desbloqueas \"Portería a cero\"."],
 ["Aynı sezon-takımdan oyuncular, aynı kulüpten 3 ve üstü oyuncu ve efsane ikililer (Hagi ile Hakan Şükür, Metin, Ali ve Feyyaz, Sneijder ile Drogba, Alex ile Tuncay gibi) takımına bonus verir. Toplam kimya en fazla +5 olur.","Players from the same team-season, 3+ players from one club and legendary duos (Hagi & Hakan Şükür, Metin, Ali & Feyyaz, Sneijder & Drogba, Alex & Tuncay…) give your team a bonus. Total chemistry is capped at +5.","Jugadores del mismo equipo-temporada, 3+ del mismo club y dúos legendarios (Hagi y Hakan Şükür, Metin, Ali y Feyyaz, Sneijder y Drogba, Alex y Tuncay…) dan un bonus. La química total llega como mucho a +5."],
 ["İlk 11'den sonra 7 yedek seçersin (1 kaleci, 2 defans, 2 orta saha, 2 forvet). Turnuva kurayla başlar: her torbadan (şampiyonlar, ikinciler, üçüncüler) bir takım grubuna düşer, Son 16'da da rakibin kurayla belli olur. Topları tek tek çekebilir ya da kurayı atlayabilirsin. Her maçtan önce takımına bir konuşma yaparsın: oyuncuların morali yükselir ya da düşer, moral reytinge yansır. Kırmızı kart gören oyuncu bir sonraki maçta cezalıdır, sakatlanan oyuncu 1-2 maç yoktur ve maç içinde yedeğin girer (en fazla 5 değişiklik). Maç önünde ilk 11'e dokunup yedekle değiştirebilirsin. Eleme maçı penaltılara kalırsa oyun durur ve penaltıcılarını sen sıralarsın. Her maçın bir hakemi, her rakibin teknik direktörü var.","After your XI you pick 7 subs (1 goalkeeper, 2 defenders, 2 midfielders, 2 forwards). The tournament starts with a draw: one team from each pot (champions, runners-up, third place) joins your group, and your Round of 16 opponent is drawn too. Draw balls one by one or skip. Before each match you give a team talk: morale goes up or down and affects ratings. A red card means a one-match ban; injured players miss 1-2 matches and a sub comes on (max 5 changes). Before a match you can swap starters with subs. If a knockout goes to penalties, the game pauses and you order your takers. Every match has a referee and every opponent a coach.","Tras tu once eliges 7 suplentes (1 portero, 2 defensas, 2 centrocampistas, 2 delanteros). El torneo empieza con un sorteo: un equipo de cada bombo (campeones, subcampeones, terceros) cae en tu grupo, y tu rival de octavos también se sortea. Saca las bolas una a una o salta. Antes de cada partido das una charla: la moral sube o baja e influye en la valoración. Una roja supone un partido de sanción; un lesionado se pierde 1-2 partidos y entra un suplente (máx. 5 cambios). Antes del partido puedes cambiar titulares por suplentes. Si una eliminatoria llega a penaltis, el juego se pausa y ordenas a tus lanzadores. Cada partido tiene árbitro y cada rival su entrenador."],
 ["7 oyun tarzı var: Dengeli, Topa sahip ol, Önde baskı, Kontra atak, Kanat oyunu, Uzun top ve Otobüsü çek. Bazı tarzlar birbirini yener: kontra önde basana, önde baskı topa sahip olana, uzun top önde basana, kanat oyunu ve topa sahip olmak otobüse karşı etkilidir. Tarzın gücü kadrona da bağlı: topa sahip olmak iyi orta saha, kanat oyunu iyi kanat ve bekler, kontra ve uzun top iyi forvet ister. Önde baskı 60. dakikadan sonra yorar. Rakiplerin de tarzı var, çoğu teknik direktörüne göre. Maç önünde rakibin tarzını görüp kendi tarzını seçersin. Devre arasında oyun durur: tarzı değiştirebilir, hücuma geçebilir ya da skoru korumaya çekilebilir, oyuncu değiştirebilirsin (Anında hızda devre arası atlanır).","There are 7 styles: Balanced, Possession, High press, Counter-attack, Wing play, Long ball and Park the bus. Some beat others: counter beats the press, the press beats possession, long ball beats the press, and wing play and possession break down the bus. A style's strength depends on your squad: possession needs a good midfield, wing play good wingers and full-backs, counter and long ball a good striker. The high press tires you after the 60th minute. Opponents have styles too, mostly based on their coach. Before each match you see the opponent's style and choose yours. At half-time the game pauses: change style, go on the attack or protect the lead, and make substitutions (skipped at Instant speed).","Hay 7 estilos: Equilibrado, Posesión, Presión alta, Contraataque, Juego por bandas, Balón largo y Aparcar el autobús. Algunos ganan a otros: la contra a la presión, la presión a la posesión, el balón largo a la presión, y las bandas y la posesión rompen el autobús. La fuerza del estilo depende de tu plantilla: la posesión pide buen medio campo, las bandas buenos extremos y laterales, la contra y el balón largo un buen delantero. La presión alta cansa tras el minuto 60. Los rivales también tienen estilo, casi siempre según su entrenador. Antes de cada partido ves el estilo rival y eliges el tuyo. En el descanso el juego se pausa: cambia de estilo, ataca o protege el resultado y haz cambios (se salta en velocidad Instantánea)."],
 ["Kimya","Chemistry","Química"],
];

// "kenar" sembollerini ayırıp çekirdeği çevir
const EDGE = /^([🧪⚙🔊🔇🌐⚗\s ·•✕↺▶✓⚠✅❌⚽🔁🟥🟨🚑📋🎲🧠⚔️🔥📒🗓️🎮👑🏅📸📤⬇️🧘🤝☝️🎯⚡🏹🪽🚀🚌⚖️🌙🟩📺🎱🥅🗣️🏁🟢⏸️⏱️💔🚩➕📲️‍]*)([\s\S]*?)([\s ▶✓⚠…️]*)$/u;
function tcore(s){
  if (!s) return s;
  if (DICT[s]) return DICT[s][LI];
  const e = s.match(EDGE);
  if (e && (e[1]||e[3]) && e[2]){ const c = tcore(e[2]); if (c!==e[2]) return e[1]+c+e[3]; }
  if (s.includes(" · ")){ const parts = s.split(" · "), out = parts.map(tcore); if (out.some((x,i)=>x!==parts[i])) return out.join(" · "); }
  for (const [re, fn] of RX){ const m = s.match(re); if (m) return fn(m); }
  if (/^[A-ZÇĞİÖŞÜ]+(\/[A-ZÇĞİÖŞÜ]+)*$/.test(s)){ const ps = s.split("/"); if (ps.every(p=>POS_I18N[p])) return ps.map(p=>POS_I18N[p][LI]).join("/"); }
  return s;
}
function L(s){ if (LANG==="tr" || s==null) return s; s=String(s); const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/); return m[1]+tcore(m[2])+m[3]; }
const Lines = s => LANG==="tr" ? s : String(s).split("\n").map(L).join("\n");

function translateNode(n){
  if (n.nodeType===3){ const v=n.nodeValue; if (!v || !v.trim()) return; const t=L(v); if (t!==v) n.nodeValue=t; return; }
  if (n.nodeType!==1 || /^(SCRIPT|STYLE)$/.test(n.tagName)) return;
  for (const a of ["placeholder","title"]) if (n.hasAttribute && n.hasAttribute(a)){ const v=n.getAttribute(a), t=L(v); if (t!==v) n.setAttribute(a,t); }
  for (const c of n.childNodes) translateNode(c);
}
function startI18n(){
  if (LANG==="tr" || typeof document==="undefined" || typeof MutationObserver==="undefined" || !document.body) return;
  document.documentElement.lang = LANG;
  translateNode(document.body); document.title = L(document.title);
  new MutationObserver(ms => { for (const m of ms){ if (m.type==="characterData") translateNode(m.target); else for (const n of m.addedNodes) translateNode(n); } })
    .observe(document.body, {subtree:true, childList:true, characterData:true});
  try { const ft = CanvasRenderingContext2D.prototype.fillText; CanvasRenderingContext2D.prototype.fillText = function(t, ...a){ return ft.call(this, L(String(t)), ...a); }; } catch(e){}
}
